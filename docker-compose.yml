services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"   # must match the Jenkins SG (opens 8080)
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      # Mount JCasC config file
      - ./casc.yaml:/usr/share/jenkins/ref/casc.yaml:ro
      # Mount host Docker socket to allow running docker commands
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "988" # Docker group GID on the EC2 Ubuntu host
    environment:
      # Enable JCasC config location
      - CASC_JENKINS_CONFIG=/usr/share/jenkins/ref/casc.yaml

      # JVM/Maven memory caps to prevent OOM on the shared host.
      # JAVA_OPTS here overrides the Dockerfile ENV, so the setup-wizard skip
      # is repeated to keep it in effect.
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx2g -Xms512m -XX:+UseG1GC
      - MAVEN_OPTS=-Xmx1g -Xms256m

      # Secrets placeholders to be injected from .env file or system env
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-admin123}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-northeast-1}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}
      - KUBECONFIG_CONTENT=${KUBECONFIG_CONTENT}

      # --- Telephony project ---
      # Empty defaults preserve the casc.yaml fallbacks
      # (${GITHUB_USER}/Telephony-Service.git and .../Telephony-Infrastructure.git).
      # Set these in .env only to pin/override the repos.
      # INFRA_REPO_URL is where the telephony pipelines now live.
      - INFRA_REPO_URL=${INFRA_REPO_URL:-}
      - TELEPHONY_REPO_URL=${TELEPHONY_REPO_URL:-}
      # Deployment secrets consumed by the telephony pipelines
      # (JCasC creds postgres-password, pgadmin-password, freeswitch-esl-password).
      - TELEPHONY_POSTGRES_PASSWORD=${TELEPHONY_POSTGRES_PASSWORD}
      - TELEPHONY_PGADMIN_PASSWORD=${TELEPHONY_PGADMIN_PASSWORD}
      - TELEPHONY_ESL_PASSWORD=${TELEPHONY_ESL_PASSWORD}

      # --- OAS catalogue services ---
      # Per-service DB passwords (usernames are read from services/*.config.yaml).
      - ACS_DB_PASSWORD=${ACS_DB_PASSWORD}
      - OAS_DB_PASSWORD=${OAS_DB_PASSWORD}
      # oas-auth-service: Keycloak client secret (JCasC cred keycloak-client-secret).
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      # Keycloak master admin (JCasC cred keycloak-admin) — used ONLY by the pipeline's
      # realm-configuration stage. The application never sees these.
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - OAS_ES_USERNAME=${OAS_ES_USERNAME}
      - OAS_ES_PASSWORD=${OAS_ES_PASSWORD}
      - OAS_NODE_SSH_PRIVATE_KEY=${OAS_NODE_SSH_PRIVATE_KEY}
      - OAS_INFRA_REPO_URL=${OAS_INFRA_REPO_URL:-https://github.com/Open-Agri-Stack/OAS-Infra.git}

volumes:
  jenkins_data:
