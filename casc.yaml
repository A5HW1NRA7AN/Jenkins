jenkins:
  systemMessage: "Jenkins CI/CD Automation Server for Telephony Microservices Project."
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
          description: "Administrator User"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# Configure credentials
credentials:
  system:
    domainCredentials:
      - credentials:
          # AWS ECR Deployment credentials
          - aws:
              scope: GLOBAL
              id: "aws-credentials"
              accessKey: "${AWS_ACCESS_KEY_ID}"
              secretKey: "${AWS_SECRET_ACCESS_KEY}"
              description: "AWS Access Credentials for ECR Registry"
          
          # GitHub API Access Token (for checkout and repository triggers)
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub API Authentication Token"
          
          # SSH Private Key for EC2 remote deployments
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "ssh-private-key"
              username: "ubuntu"
              privateKeySource:
                directEntry:
                  privateKey: "${SSH_PRIVATE_KEY}"
              description: "SSH Private Key for EC2 remote deployments"

          # Kubeconfig file for Kubernetes remote deployments
          - file:
              scope: GLOBAL
              id: "kubeconfig"
              fileName: "kubeconfig"
              secretBytes: "${KUBECONFIG_CONTENT}"
              description: "Kubeconfig for Kubernetes remote deployments"

          # --- agri-catalogue-service (OAS) credentials ---
          # Postgres credentials for catalogue-service.
          # Per-service Postgres PASSWORDS (secret text). The DB USERNAME is
          # non-secret and read from services/<service>.config.yaml by the
          # pipeline, so only the password lives here. IDs match the pipeline's
          # db-password-${SERVICE} lookup. Values = db-host/.env ACS/OAS_DB_PASSWORD.
          - string:
              scope: GLOBAL
              id: "db-password-agri-catalogue"
              secret: "${ACS_DB_PASSWORD}"
              description: "Postgres password for agri-catalogue (acs_user / acs_db)"
          - string:
              scope: GLOBAL
              id: "db-password-organisation-catalogue"
              secret: "${OAS_DB_PASSWORD}"
              description: "Postgres password for organisation-catalogue (oas_user / oas_db)"

          # Elasticsearch credentials (shared; ES security is disabled on the DB
          # host so these are effectively ignored, but the app still sends them).
          - usernamePassword:
              scope: GLOBAL
              id: "ES_CREDENTIALS"
              username: "${OAS_ES_USERNAME}"
              password: "${OAS_ES_PASSWORD}"
              description: "Elasticsearch credentials for the catalogue services"

          # Shared SSH key for the OAS platform: authenticates BOTH the bastion
          # (ProxyJump) and the private k8s node — it is the oas-uat terraform
          # key pair (terraform/environments/oas-uat/oas-key.pem).
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "ec2-deploy-key"
              username: "ubuntu"
              privateKeySource:
                directEntry:
                  privateKey: "${OAS_NODE_SSH_PRIVATE_KEY}"
              description: "Shared SSH key for the OAS bastion + private k8s node (oas-uat)"

# Automatically create pipeline jobs using Job DSL
jobs:
  - script: |
      pipelineJob('telephony-ec2') {
        description('Pipeline for the Standalone EC2 Deployment')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('TELEPHONY_REPO_URL') ?: 'https://github.com/' + System.getenv('GITHUB_USER') + '/Telephony-Service.git')
                  credentials('github-credentials')
                }
                branch('*/freeswitch')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: |
      pipelineJob('telephony-missed-call') {
        description('Pipeline for the Missed Call Campaign variant')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('TELEPHONY_REPO_URL') ?: 'https://github.com/' + System.getenv('GITHUB_USER') + '/Telephony-Service.git')
                  credentials('github-credentials')
                }
                branch('*/freeswitch-kubernetes')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: |
      pipelineJob('telephony-ivr') {
        description('Pipeline for the Multilingual IVR Campaign variant')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('TELEPHONY_REPO_URL') ?: 'https://github.com/' + System.getenv('GITHUB_USER') + '/Telephony-Service.git')
                  credentials('github-credentials')
                }
                branch('*/freeswitch-ivr-kubernetes')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: |
      pipelineJob('agri-catalogue-service') {
        description('CI/CD for agri-catalogue-service (OAS). OAS-Infra drives: checkout app, build image from the app Dockerfile, push to ECR, deploy via Helm on the K8s node.')
        parameters {
          stringParam('SERVICE', 'agri-catalogue', 'Service to build/deploy — selects services/<SERVICE>.config.yaml.')
          stringParam('BASTION_HOST', '', 'Bastion public IP (terraform output: bastion_public_ip) — SSH ProxyJump host.')
          stringParam('NODE_PRIVATE_IP', '', 'K8s node private IP (terraform output: node_private_ip).')
          stringParam('NGINX_HOST', '', 'nginx public IP (terraform output: nginx_public_ip) — used for the smoke test.')
          stringParam('SMOKE_API_KEY', '', 'Optional Kong role key for the through-nginx smoke test; blank to skip.')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('OAS_INFRA_REPO_URL') ?: 'https://github.com/Open-Agri-Stack/OAS-Infra.git')
                  credentials('github-credentials')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
        // No SCM poll trigger: the pipeline needs BASTION_HOST + NODE_PRIVATE_IP,
        // so deploys are triggered manually (or via a parameterized webhook that
        // supplies them from `terraform output` of the oas-uat environment).
      }
  - script: |
      pipelineJob('organisation-catalogue') {
        description('CI/CD for organisation-catalogue (OAS). OAS-Infra drives: checkout app, build image from the app Dockerfile, push to ECR, deploy via Helm on the K8s node.')
        parameters {
          stringParam('SERVICE', 'organisation-catalogue', 'Service to build/deploy — selects services/<SERVICE>.config.yaml.')
          stringParam('BASTION_HOST', '', 'Bastion public IP (terraform output: bastion_public_ip) — SSH ProxyJump host.')
          stringParam('NODE_PRIVATE_IP', '', 'K8s node private IP (terraform output: node_private_ip).')
          stringParam('NGINX_HOST', '', 'nginx public IP (terraform output: nginx_public_ip) — used for the smoke test.')
          stringParam('SMOKE_API_KEY', '', 'Optional Kong role key for the through-nginx smoke test; blank to skip.')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('OAS_INFRA_REPO_URL') ?: 'https://github.com/Open-Agri-Stack/OAS-Infra.git')
                  credentials('github-credentials')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
      }
