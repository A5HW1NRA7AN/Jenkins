jenkins:
  systemMessage: "Jenkins CI/CD Automation Server for Telephony Microservices Project."
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
          description: "Administrator User"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# Configure credentials
credentials:
  system:
    domainCredentials:
      - credentials:
          # AWS ECR Deployment credentials
          - aws:
              scope: GLOBAL
              id: "aws-credentials"
              accessKey: "${AWS_ACCESS_KEY_ID}"
              secretKey: "${AWS_SECRET_ACCESS_KEY}"
              description: "AWS Access Credentials for ECR Registry"
          
          # GitHub API Access Token (for checkout and repository triggers)
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub API Authentication Token"
          
          # SSH Private Key for EC2 remote deployments
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "ssh-private-key"
              username: "ubuntu"
              privateKeySource:
                directEntry:
                  privateKey: "${SSH_PRIVATE_KEY}"
              description: "SSH Private Key for EC2 remote deployments"

          # Kubeconfig file for Kubernetes remote deployments
          - file:
              scope: GLOBAL
              id: "kubeconfig"
              fileName: "kubeconfig"
              secretBytes: "${KUBECONFIG_CONTENT}"
              description: "Kubeconfig for Kubernetes remote deployments"

          # Telephony deployment secrets. Consumed by
          # Telephony-Infrastructure/jenkins/Jenkinsfile-{ec2,k8s}; the
          # pipelines fail the build if any of these is missing rather than
          # falling back to a default.
          - string:
              scope: GLOBAL
              id: "postgres-password"
              secret: "${TELEPHONY_POSTGRES_PASSWORD}"
              description: "Postgres password for the telephony lead_db (lead_user)"
          - string:
              scope: GLOBAL
              id: "pgadmin-password"
              secret: "${TELEPHONY_PGADMIN_PASSWORD}"
              description: "pgAdmin login password for the telephony stack"
          - string:
              scope: GLOBAL
              id: "freeswitch-esl-password"
              secret: "${TELEPHONY_ESL_PASSWORD}"
              description: "FreeSWITCH Event Socket (ESL) password"

          # --- agri-catalogue-service (OAS) credentials ---
          # Postgres credentials for catalogue-service.
          # Per-service Postgres PASSWORDS (secret text). The DB USERNAME is
          # non-secret and read from services/<service>.config.yaml by the
          # pipeline, so only the password lives here. IDs match the pipeline's
          # db-password-${SERVICE} lookup. Values = db-host/.env ACS/OAS_DB_PASSWORD.
          - string:
              scope: GLOBAL
              id: "db-password-agri-catalogue"
              secret: "${ACS_DB_PASSWORD}"
              description: "Postgres password for agri-catalogue (acs_user / acs_db)"
          - string:
              scope: GLOBAL
              id: "db-password-org-user-notification-services"
              secret: "${OAS_DB_PASSWORD}"
              description: "Postgres password for org-user-notification-services (oas_user / oas_db)"

          # oas-auth-service: Keycloak client secret (from setup-realm.sh). No DB —
          # the pipeline builds a k8s Secret with just KEYCLOAK_CLIENT_SECRET.
          - string:
              scope: GLOBAL
              id: "keycloak-client-secret"
              secret: "${KEYCLOAK_CLIENT_SECRET}"
              description: "Keycloak client secret for oas-auth-service"

          # Keycloak MASTER admin — used ONLY by the oas-auth-service pipeline's
          # realm-configuration stage, which runs the app's setup-realm.sh against the
          # live Keycloak over a bastion tunnel. It never reaches the application: the
          # app administers users as its own client service account.
          - usernamePassword:
              scope: GLOBAL
              id: "keycloak-admin"
              username: "${KEYCLOAK_ADMIN_USER}"
              password: "${KEYCLOAK_ADMIN_PASSWORD}"
              description: "Keycloak master admin (realm configuration only)"

          # Elasticsearch credentials (shared; ES security is disabled on the DB
          # host so these are effectively ignored, but the app still sends them).
          - usernamePassword:
              scope: GLOBAL
              id: "ES_CREDENTIALS"
              username: "${OAS_ES_USERNAME}"
              password: "${OAS_ES_PASSWORD}"
              description: "Elasticsearch credentials for the catalogue services"

          # Shared SSH key for the OAS platform: authenticates BOTH the bastion
          # (ProxyJump) and the private k8s node — it is the oas-uat terraform
          # key pair (terraform/environments/oas-uat/oas-key.pem).
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "ec2-deploy-key"
              username: "ubuntu"
              privateKeySource:
                directEntry:
                  privateKey: "${OAS_NODE_SSH_PRIVATE_KEY}"
              description: "Shared SSH key for the OAS bastion + private k8s node (oas-uat)"

# Automatically create pipeline jobs using Job DSL
jobs:
  - script: |
      // Telephony pipelines live in the Telephony-Infrastructure repository.
      // The application repo is checked out by the Jenkinsfile at the branch
      // the pipeline derives from the job name, so nothing here is pinned to
      // an application branch any more.
      def infraRepo = System.getenv('INFRA_REPO_URL') ?: 'https://github.com/' + System.getenv('GITHUB_USER') + '/Telephony-Infrastructure.git'
      def appRepo   = System.getenv('TELEPHONY_REPO_URL') ?: ''

      [
        [name: 'telephony-ec2',
         desc: 'Standalone EC2 (Docker Compose) deployment. Builds the freeswitch branch of Telephony-Service.',
         path: 'jenkins/Jenkinsfile-ec2'],
        [name: 'telephony-missed-call',
         desc: 'Kubernetes deployment, missed-call campaign. Builds the freeswitch branch of Telephony-Service.',
         path: 'jenkins/Jenkinsfile-k8s'],
        [name: 'telephony-ivr',
         desc: 'Kubernetes deployment, multilingual IVR campaign. Builds the freeswitch-ivr branch of Telephony-Service.',
         path: 'jenkins/Jenkinsfile-k8s'],
      ].each { job ->
        pipelineJob(job.name) {
          description(job.desc)
          parameters {
            stringParam('APP_REPO_URL', appRepo, 'Telephony-Service git URL. Blank falls back to the TELEPHONY_REPO_URL environment variable.')
          }
          definition {
            cpsScm {
              scm {
                git {
                  remote {
                    url(infraRepo)
                    credentials('github-credentials')
                  }
                  branch('*/main')
                }
              }
              scriptPath(job.path)
            }
          }
        }
      }
  - script: |
      pipelineJob('agri-catalogue-service') {
        description('CI/CD for agri-catalogue-service (OAS). Press-button deploy: no parameters — the Jenkinsfile derives SERVICE from the job name and auto-discovers the bastion/node/nginx IPs from EC2 tags via aws-credentials.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('OAS_INFRA_REPO_URL') ?: 'https://github.com/Open-Agri-Stack/OAS-Infra.git')
                  credentials('github-credentials')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
        // No trigger: deploys are manual (press Build). Everything the pipeline
        // needs is auto-discovered — no parameters to fill in.
      }
  - script: |
      pipelineJob('org-user-notification-services') {
        description('CI/CD for org-user-notification-services (OAS). Press-button deploy: no parameters — the Jenkinsfile derives SERVICE from the job name and auto-discovers the bastion/node/nginx IPs from EC2 tags via aws-credentials.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('OAS_INFRA_REPO_URL') ?: 'https://github.com/Open-Agri-Stack/OAS-Infra.git')
                  credentials('github-credentials')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
      }
  - script: |
      pipelineJob('oas-auth-service') {
        description('CI/CD for oas-auth-service (OAS). Press-button deploy: no parameters. ClusterIP-only, NO Kong route; uses the keycloak-client-secret credential (no DB).')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('OAS_INFRA_REPO_URL') ?: 'https://github.com/Open-Agri-Stack/OAS-Infra.git')
                  credentials('github-credentials')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
      }
